<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nordvik Invoice Approval</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; }
    label { display: block; margin: .4rem 0 .1rem; font-size: .85rem; color: #444; }
    input, select, button { padding: .4rem; font-size: .9rem; }
    button { cursor: pointer; background: #1552b0; color: #fff; border: none; border-radius: 4px; }
    button.secondary { background: #666; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid #ddd; padding: .35rem .5rem; text-align: left; }
    .state-approved { color: #137333; } .state-rejected { color: #c5221f; } .state-submitted { color: #b06000; }
    #msg { padding: .5rem; border-radius: 4px; margin: .5rem 0; display: none; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    .muted { color: #777; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>Nordvik Components Oy — Invoice Approval</h1>
  <div id="msg"></div>

  <div id="auth-box">
    <fieldset>
      <legend>Sign in</legend>
      <label>Email</label><input id="email" value="approver1@nordvik.example" />
      <label>Password</label><input id="password" type="password" value="password123" />
      <div style="margin-top:.6rem"><button onclick="login()">Sign in</button></div>
      <p class="muted">Demo: submitter1@nordvik.example / approver1@nordvik.example — password123</p>
    </fieldset>
  </div>

  <div id="app" style="display:none">
    <p>Signed in as <strong id="who"></strong> <button class="secondary" onclick="logout()">Sign out</button></p>

    <div id="submitter-ui" style="display:none">
      <h2>Create invoice</h2>
      <fieldset>
        <form id="create-form" onsubmit="createInvoice(event)">
          <div class="row">
            <div><label>Amount (EUR)</label><input name="amount" type="number" step="0.01" required /></div>
            <div><label>Counterparty name</label><input name="counterparty_name" required /></div>
            <div><label>Counterparty contact email</label><input name="counterparty_email" type="email" required /></div>
            <div><label>Due date</label><input name="due_date" type="date" required /></div>
            <div><label>PDF attachment</label><input name="pdf" type="file" accept="application/pdf" required /></div>
          </div>
          <div style="margin-top:.6rem"><button>Submit invoice</button></div>
        </form>
      </fieldset>
    </div>

    <div id="approver-ui" style="display:none">
      <h2>Pending my approval</h2>
      <fieldset>
        <div class="row">
          <div><label>Counterparty contains</label><input id="f-name" /></div>
          <div><label>Min amount</label><input id="f-min" type="number" step="0.01" /></div>
          <div><label>Max amount</label><input id="f-max" type="number" step="0.01" /></div>
          <div><button onclick="loadPending()">Filter</button></div>
        </div>
      </fieldset>
      <table id="pending-table"><thead><tr><th>ID</th><th>Amount</th><th>Counterparty</th><th>Due</th><th>Needs</th><th>Actions</th></tr></thead><tbody></tbody></table>
    </div>

    <h2>My invoices</h2>
    <table id="invoices-table"><thead><tr><th>ID</th><th>Amount</th><th>Counterparty</th><th>State</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </div>

<script>
let me = null;
const $ = (id) => document.getElementById(id);
function flash(text, ok = true) {
  const m = $('msg'); m.textContent = text; m.style.display = 'block';
  m.style.background = ok ? '#e6f4ea' : '#fce8e6'; m.style.color = ok ? '#137333' : '#c5221f';
  setTimeout(() => (m.style.display = 'none'), 4000);
}
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function login() {
  try {
    me = await api('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('password').value }),
    });
    render();
  } catch (e) { flash(e.message, false); }
}
async function logout() { await api('/api/auth/logout', { method: 'POST' }); me = null; render(); }
function render() {
  $('auth-box').style.display = me ? 'none' : 'block';
  $('app').style.display = me ? 'block' : 'none';
  if (!me) return;
  $('who').textContent = `${me.email} (${me.role})`;
  $('submitter-ui').style.display = me.role === 'submitter' ? 'block' : 'none';
  $('approver-ui').style.display = me.role === 'approver' ? 'block' : 'none';
  loadInvoices();
  if (me.role === 'approver') loadPending();
}
async function createInvoice(e) {
  e.preventDefault();
  try {
    await api('/api/invoices', { method: 'POST', body: new FormData(e.target) });
    e.target.reset(); flash('Invoice submitted'); loadInvoices();
  } catch (err) { flash(err.message, false); }
}
async function loadInvoices() {
  const rows = await api('/api/invoices');
  $('invoices-table').querySelector('tbody').innerHTML = rows.map((i) =>
    `<tr><td>${i.id}</td><td>${i.amount_eur.toFixed(2)}</td><td>${esc(i.counterparty_name)}</td>
     <td class="state-${i.state}">${i.state}</td>
     <td><button class="secondary" onclick="showEmail(${i.id})">Show email</button>
         <button class="secondary" onclick="eraseEmail(${i.id})">Erase email</button></td></tr>`).join('');
}
async function loadPending() {
  const p = new URLSearchParams();
  if ($('f-name').value) p.set('counterparty', $('f-name').value);
  if ($('f-min').value) p.set('min_amount', $('f-min').value);
  if ($('f-max').value) p.set('max_amount', $('f-max').value);
  const rows = await api('/api/invoices/pending?' + p.toString());
  $('pending-table').querySelector('tbody').innerHTML = rows.map((i) =>
    `<tr><td>${i.id}</td><td>${i.amount_eur.toFixed(2)}</td><td>${esc(i.counterparty_name)}</td><td>${i.due_date}</td>
     <td>${i.approvals_required}</td>
     <td><button onclick="decide(${i.id},'approve')">Approve</button>
         <button class="secondary" onclick="decide(${i.id},'reject')">Reject</button></td></tr>`).join('') ||
    '<tr><td colspan="6" class="muted">Nothing pending.</td></tr>';
}
async function decide(id, action) {
  try { const r = await api(`/api/invoices/${id}/${action}`, { method: 'POST' });
    flash(r.message || `Invoice ${id} ${action}d`); loadPending(); loadInvoices();
  } catch (e) { flash(e.message, false); }
}
async function showEmail(id) {
  try { const r = await api(`/api/invoices/${id}/counterparty-email`);
    flash(r.erased ? `Invoice ${id}: email erased` : `Invoice ${id} email: ${r.counterparty_email}`);
  } catch (e) { flash(e.message, false); }
}
async function eraseEmail(id) {
  try { await api(`/api/invoices/${id}/counterparty-email`, { method: 'DELETE' });
    flash(`Invoice ${id}: email erased`); } catch (e) { flash(e.message, false); }
}
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
(async () => { try { me = await api('/api/auth/me'); } catch {} render(); })();
</script>
</body>
</html>
