{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 3rem auto;">
  <h2>Sign in</h2>
  <form method="post" action="{{ url_for('views.login') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus style="width: 100%;">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required style="width: 100%;">
    <p><button type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
